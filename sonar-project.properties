# SonarCloud configuration for the Pastelpines Shopify theme.
#
# IMPORTANT: verify projectKey / organization against your SonarCloud project
# (Project > Information). They are usually "<login>_<repo>" and "<login>".
sonar.projectKey=spchandera_Pastelpines
sonar.organization=spchandera
sonar.projectName=Pastelpines

# --- Analysis scope -----------------------------------------------------------
# A Shopify theme ships with a large amount of vendored / generated / minified
# code (the compiled theme bundle, third-party libraries, icon fonts, locale
# files). None of that is authored or maintained by us, so it is excluded from
# analysis. We grade ONLY the code our team actually wrote.
sonar.sources=assets
sonar.inclusions=assets/cart-counter.js,assets/collection-sku-sort.js,assets/custom-events.js,assets/custom.css

# Unit tests
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.js

# --- Coverage -----------------------------------------------------------------
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# --- Encoding -----------------------------------------------------------------
sonar.sourceEncoding=UTF-8
